<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GeoGebra verification</title>
<style>
body{font:14px system-ui;margin:20px}button,input{padding:8px}pre{white-space:pre-wrap;background:#f3f7fa;padding:12px;max-height:420px;overflow:auto}#status{font-weight:700}.viewport{width:960px;max-width:100%;height:480px;border:1px solid #bbb}.viewport #canvas{height:100%}body[data-page=smoke] .viewport{width:100%;border:0}body[data-page=smoke] #canvas{height:480px;border:1px solid #ddd}body[data-page=curve] .viewport,body[data-page=qlcu1] .viewport{width:800px}iframe{width:100%;height:740px}
</style></head>
<body><h1 id="title">GeoGebra verification</h1><p id="description"></p>
<div id="timing" hidden><label>Rounds <input id="rounds" type="number" value="3" min="1" max="8"></label> <label>Updates per case <input id="steps" type="number" value="12" min="2" max="120"></label></div>
<button id="run">Run verification</button><span id="command-controls" hidden><button id="probe">Run commands</button><textarea id="commands" rows="5" cols="100" aria-label="Commands"></textarea></span>
<p id="status">Ready</p><pre id="results">Ready</pre><div class="viewport" id="viewport"><div id="canvas"></div></div><iframe id="test" title="Native test" hidden></iframe>
<details id="json-details" hidden><summary>Raw JSON</summary><pre id="json"></pre></details><details id="raw-details" hidden><summary>Raw results</summary><pre id="raw"></pre></details>
<script type="module" src="./verification.ts"></script></body></html>
