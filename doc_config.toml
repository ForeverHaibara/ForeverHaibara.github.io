title = "Sum of Squares"
introduction = """\
The `sum_of_squares` function is the core utility for performing sum of squares \
decomposition on a given expression, potentially with constraints.  It takes a \
symbolic expression (a SymPy `Expr`) and attempts to express it in sum of squares. \
This is a common technique to prove that the polynomial is nonnegative. The \
function can also handle problems with inequality and equality constraints."""
